<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
<rect width="1400" height="460" fill="#f3eadc"/>
<text x="64" y="50" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="2.0">SYSTEM BOUNDARY</text>
<text x="64" y="96" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Execution without fiscal authority</text>
<text x="64" y="128" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" text-anchor="start" letter-spacing="0">Pi executes. Drenyra AI validates. The professional decides.</text>

<!-- Pi -->
<g transform="translate(64 178)">
  <rect width="330" height="196" rx="14" fill="#fff7ea" stroke="#66513b"/>
  <text x="24" y="32" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">DRENYRA PI</text>
  <text x="24" y="68" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Operate</text>
  <text x="24" y="101" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">runs agents · commands · skills</text>
  <text x="24" y="126" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">defines scope · handles routing</text>
  <text x="24" y="151" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">uses tools under broad-deny</text>
  <text x="24" y="178" fill="#a7471c" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">no fiscal authority</text>
</g>

<!-- AI -->
<g transform="translate(536 178)">
  <rect width="330" height="196" rx="14" fill="#fff7ea" stroke="#66513b"/>
  <text x="24" y="32" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">DRENYRA AI</text>
  <text x="24" y="68" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Validate</text>
  <text x="24" y="101" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">deterministic validation</text>
  <text x="24" y="126" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">materiality + mission-state gates</text>
  <text x="24" y="151" fill="#352e22" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="500" text-anchor="start" letter-spacing="0">consistent, verifiable outcomes</text>
  <text x="24" y="178" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">authority boundary enforced</text>
</g>

<!-- Human -->
<g transform="translate(1008 178)">
  <rect width="328" height="196" rx="14" fill="#decbb1" stroke="#66513b"/>
  <text x="24" y="32" fill="#725e4c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1.5">PROFESSIONAL</text>
  <text x="24" y="68" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Decide</text>
  <text x="24" y="103" fill="#315b31" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">approve</text>
  <text x="24" y="128" fill="#842f24" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">reject</text>
  <text x="24" y="153" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="start" letter-spacing="0">correct</text>
  <text x="24" y="178" fill="#100c07" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">fiscal authority remains human</text>
</g>

<!-- gates -->
<path d="M394 276 H536" stroke="#3e2f20" stroke-width="1.7"/>
<circle cx="465" cy="276" r="22" fill="#e6d7c4" stroke="#0d4a68" stroke-width="1.5"/>
<text x="465" y="281" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0">V</text>
<text x="465" y="319" fill="#0d4a68" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">VALIDATION</text>
<path d="M866 276 H1008" stroke="#3e2f20" stroke-width="1.7"/>
<circle cx="937" cy="276" r="22" fill="#e6d7c4" stroke="#57478b" stroke-width="1.5"/>
<text x="937" y="281" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0">H</text>
<text x="937" y="319" fill="#57478b" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1">DECISION</text>

<g transform="translate(64 405)">
  <text x="0" y="0" fill="#a7471c" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" text-anchor="start" letter-spacing="0.5">Fiscal authority remains outside Drenyra Pi.</text>
</g>
</svg>