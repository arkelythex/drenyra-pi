notes: >-
  Major finding: lib/routing/ (preflight -> Core-delegated route decision ->
  bounded executor with real BudgetLedger enforcement) is architecturally
  sound and unit/contract-tested (62 tests), but is NOT wired into any live
  /drenyra:* command today. Only the "durable" modality has a production
  port (createDurableMissionRoutingPort in lib/mission-commands.ts); "direct"
  and "delegated" ports have zero real implementations anywhere, only test
  stubs. No command handler ever calls executeRoutingWork/runRoutingPreflight.
  "Agents and models connected with budgets" is not met by any mechanism:
  BudgetLedger is real but only instantiated in tests; agents/ has zero
  code-level budget linkage; model-routing registry is advisory-only
  (confirmed in SDD #1). Recommended approach: wire only the "direct" port
  into one existing read-only command (2-of-3 modalities live), leave
  "delegated" as an explicit tracked follow-up requiring an agent-dispatch
  design decision. Open scope decision before propose: does the acceptance
  bar require all 3 modalities live in this one change, or is 2-of-3 +
  tracked follow-up acceptable (mirrors SDD #1's pattern of not bundling
  everything into one change)?
