      as SDD #1, again resolved only after fresh, explicit, honest user
      authorization (not self-authorized), reset reason correctly attributed.
    attempt_token: "sha256:573d180fa2287f945ff7ccfe46431a0ea123de04bcf714aea9d1bf31ed833d6f"
    attempt_settled: true
