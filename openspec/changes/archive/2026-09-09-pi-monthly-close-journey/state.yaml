notes: >-
  Critical finding: SDD-050 (monthly close) is master-owned-only per README's
  Dominion Program table (same bucket as SDD-070/080/090/110) -- a change
  literally named pi-monthly-close-journey risks implying SDD-050 delivery,
  which the repo explicitly forbids (harness-draft-conformance.md: "this
  repository never re-numbers or re-defines a master SDD"). Must frame as
  Pi-local RDA-v2/SDD-040 chain-composition tooling, never SDD-050 delivery.
  Second critical finding: chains/monthly-close.ts's RECONCILE phase is a
  no-op (falls through to phase-only completion with zero domain computation)
  -- it never calls chains/reconcile.ts's real bank-vs-ledger logic, despite
  both existing and being individually well-tested. Reconciliation and
  monthly-close are two disconnected chains today, not stages of one
  pipeline. "Exceptions" and "candidates" have no first-class representation
  anywhere (CandidateLifecycle exists in drenyra-ai but has zero usage in
  this repo). The final export artifact is a minimal pointer record, not an
  assembled dossier/expediente. monthly-close-flow.test.ts IS genuine
  real-runtime integration evidence for monthly-close in isolation (real
  MissionRuntime/ApprovalGate/receipts, not mocks) but never exercises
  reconciliation, exceptions, or dossier assembly. Recommended approach: wire
  real reconcile into monthly-close's RECONCILE phase (the single most
  damaging gap) plus one genuine multi-chain test, with candidates/
  exceptions/dossier assembly explicitly named as tracked follow-ups, not
  invented under time pressure (candidates/exceptions may be kernel-owned
  concepts, per the same caution pi-skills-memory-integration already
  raised for a different domain).
