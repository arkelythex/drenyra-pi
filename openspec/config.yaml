# OpenSpec / SDD configuration — drenyra-pi
# File-back (openspec/) is AUTHORITATIVE. Engram persistence is best-effort only.

name: drenyra-pi
description: >-
      Pi-native Accounting Operations Harness — consumes a pinned, verified,
      package-local Drenyra AI runtime. Zero runtime dependencies. Public source, proprietary license (source-available).
repository: git@github.com:arkelythex/drenyra-pi.git
default_branch: main
stack:
      runtime: bun
      language: typescript
      module: esm # package.json "type": "module"
      engines: { node: ">=22" }
      test_runner: vitest
      tsconfig: strict
      package_kind: pi-extension # package.json "pi" field: extensions/prompts/skills/themes
      runtime_dependency: drenyra-ai pinned via tgz (v0.4.1), devDependency

status: active
store_mode: hybrid # openspec files authoritative + engram best-effort
test_command: bun test
typecheck_command: bun run typecheck
strict_tdd: true
tdd_discipline: RED / GREEN / TRIANGULATE / REFACTOR — write failing test first, then minimal implementation, then triangulate edge cases, then refactor. Record evidence per step.

conventions:
      money: BigInt cents — never floats
      checksums: lowercase hex sha256
      error_codes: JSON integer codes
      testing: vitest runner, fast suite (582 tests / ~1s), strict mode active

current_test_state:
      files: 52
      tests: 773
      passing: true
      failed: 0
      command: bun test
      classification: dirty-candidate
      evidence_scope: current
      candidate_identity: "dirty-sha256:4147df324fcbe20018dc2be8a1fd43e4868b05b4919c26caea814917b7558182"
      evidence_date: 2026-09-12
      evidence: >-
            PR 3 verified current snapshot. `bun test` from the canonical repository
            root ran 773 tests across 52 files with 0 failures; the dirty candidate
            identity is re-derived by `node scripts/compute-candidate-identity.mjs`
            and generated into docs/architecture/program-lock-facts.json. This is the
            canonical current snapshot; preserved older snapshots are labeled
            historical in capability-manifest.yaml and program-lock-facts.json.

phases:
      - proposal
      - specs
      - design
      - tasks
      - apply
      - verify
      - archive
