name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only contents for the whole workflow; every unlisted
# scope (checks, id-token, packages, ...) defaults to none. No job here needs
# write access — none is granted.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      # Immutable action pins: commit SHA + human-readable tag comment.
      # dependabot (github-actions ecosystem) rewrites these SHAs on release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      # The suite imports the pinned drenyra-ai runtime directly
      # (devDependency file:./vendored/drenyra-ai-0.2.0.tgz) — this job
      # exercises the REAL pinned runtime library, not a stub.
      - run: bun run test

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      # Build dist, run the full suite, verify the packaged file manifest —
      # including the cryptographic reconciliation of contracts/schemas and the
      # vendored runtime against DEFAULT_PIN (scripts/verify-package-files.mjs).
      - run: bun run verify:package
      # Prove the PUBLISHED artifact works: npm pack -> install .tgz -> the
      # postinstall installs the pinned drenyra-ai from the vendored tarball
      # and doctor() verifies the REAL released runtime package-local.
      - run: node scripts/verify-packed-install.mjs
