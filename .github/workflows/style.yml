name: Style

# Style gate for newly written code (docs/style.md). Runs the identical
# verify:style command developers run locally; fetch-depth: 0 lets the script's
# merge-base logic cover the full PR branch diff.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only contents for the whole workflow; no job here needs
# write access — none is granted.
permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      # Immutable action pins: commit SHA + human-readable tag comment.
      # dependabot (github-actions ecosystem) rewrites these SHAs on release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run verify:style
